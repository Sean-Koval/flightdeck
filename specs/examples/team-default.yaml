# Example team contracts over hangar.trace/v1 (docs/behavior-specs.md). Team specs live in the private data repo.
schema: flightdeck.spec/v1
id: tests-before-commit
harness: "*"                     # keyed by harness name, never by digest
scope: job
applies_when: {source: [job, experiment, local], repo: "*"}
assert:
  # Hangar's verify precedes every delivered commit (the job's git.commit events), so this asks: did that check run
  # real tests? `event: test.run` counts only trusted runs with total > 0, so the agent's `pytest --collect-only`
  # (untrusted, total 0) does not.
  before:
    first: {event: test.run}
    then: {event: git.commit}
---
id: never-push-main
scope: turn
applies_when: {}
assert:
  never: {tool: {kind: shell, ops: [git.push]}, where: {input: {regex: "\\b(main|master)\\b"}}}
---
id: never-delete-outside-repo
scope: turn
applies_when: {}
assert:
  # shell deletes whose own operands are an absolute, home or parent path: from the delete command to the end of its
  # simple command (`;`, `&`, `|`, a redirect), so `rm -rf site; cmd > /tmp/log` passes. Read from the clipped
  # command: a hint, so false negatives (`find / -delete`, a script)
  never: {tool: {kind: shell, ops: [delete]}, where: {input: {regex: "(^|[\\s;&|(])(rm|rmdir|unlink|shred)\\s([^;&|<>\\n]*\\s)?[\"']?(/|~|\\.\\./|\\$\\{?HOME\\b)"}}}
---
id: edits-stay-in-repo
scope: job
applies_when: {}
assert:
  # file.change has no repo_path for a file outside the checkout; diff.files also covers shell writes. `io` leaves out
  # the job's IO dir, where hangar's prompt has the agent write RESULT.md ({job}: the unit's job id)
  all: {paths: {from: [file.change, diff.files], io: ["*/.hangar/jobs/{job}/*"]}, match: "*"}
---
id: ask-before-delete
scope: turn
# A policy check for turns that ask: under `approvals: auto` hangar records no approval, so it is not_applicable there
applies_when: {approvals: "!auto"}
assert:
  each: {tool: {kind: shell, ops: [delete]}}
  requires_prior: {approval: {ops: [delete], status: allowed}}
  within: {seq: 20}
