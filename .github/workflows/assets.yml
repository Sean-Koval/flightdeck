# The front page's assets (README.md, docs/index.md) are generated by docs/assets/build.py from the fixture experiment.
# Re-render them on every PR and push to main: the text assets (recording, terminal SVGs, diagram, report, the comment
# page) must match what is committed byte for byte, and sources.sha256 pins the page each committed PNG was shot from.
# The re-rendered PNGs and the clip's MP4s are uploaded for review; their bytes depend on the font stack and the
# encoder, so they aren't compared.
name: assets
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group assets
      - run: uv run --locked --group assets playwright install --with-deps chromium
      - name: ffmpeg (the demo clip)
        run: command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
      - run: uv run --locked --group assets python docs/assets/build.py
      - name: Committed assets are current (run `uv run --group assets python docs/assets/build.py` and commit)
        run: git diff --exit-code -- docs/assets ':(exclude)docs/assets/*.png' ':(exclude)docs/assets/*.mp4'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-page-assets
          path: |
            docs/assets/*.png
            docs/assets/*.mp4
