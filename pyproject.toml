[project]
name = "flightdeck"
version = "0.0.1"
description = "Judge plane for coding-agent harnesses: reads hangar runs, paired statistics, behavior specs, task sets."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sean Koval" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<1.5",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.2",
    "typer>=0.12",
]

[project.scripts]
flightdeck = "flightdeck.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "jsonschema>=4.26.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
