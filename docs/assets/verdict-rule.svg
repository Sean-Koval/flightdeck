<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" style="max-width:100%;height:auto" role="img" aria-label="The verdict rule: an interval wholly above zero reads better, wholly above the margin non-inferior, wholly below the margin worse, and one that spans the margin No decision; fewer paired tasks than min_tasks is No decision: underpowered, and without a pre-registered decision.yaml there is No verdict"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="rule-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="318" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">The verdict rule · where the 95% interval sits picks the word</text><path d="M290 58 V214" stroke="var(--af-line-strong, #6B6B6B)" stroke-dasharray="3 3"/><text class="l" x="290" y="50" text-anchor="middle">margin</text><path d="M350 58 V214" stroke="var(--af-line-strong, #6B6B6B)"/><text class="l" x="350" y="50" text-anchor="middle">0</text><text class="e" x="160" y="50" text-anchor="start">← worse</text><text class="e" x="462" y="50" text-anchor="end">better →</text><text class="s" x="24" y="87" text-anchor="start">better</text><path d="M366 82 H462 M366 76 V88 M462 76 V88" fill="none" stroke="var(--af-fg, #FFFFFF)" stroke-width="1.5"/><circle cx="414" cy="82" r="3.5" fill="var(--af-fg, #FFFFFF)"/><text class="e" x="696" y="86" text-anchor="end">the whole interval is above zero</text><text class="s" x="24" y="127" text-anchor="start">non-inferior</text><path d="M304 122 H420 M304 116 V128 M420 116 V128" fill="none" stroke="var(--af-fg, #FFFFFF)" stroke-width="1.5"/><circle cx="362" cy="122" r="3.5" fill="var(--af-fg, #FFFFFF)"/><text class="e" x="696" y="126" text-anchor="end">the whole interval is above the margin</text><text class="s" x="24" y="167" text-anchor="start">No decision</text><path d="M250 162 H330 M250 156 V168 M330 156 V168" fill="none" stroke="var(--af-fg, #FFFFFF)" stroke-width="1.5"/><circle cx="290" cy="162" r="3.5" fill="var(--af-fg, #FFFFFF)"/><text class="e" x="696" y="166" text-anchor="end">the interval spans the margin</text><text class="s" x="24" y="207" text-anchor="start">worse</text><path d="M160 202 H276 M160 196 V208 M276 196 V208" fill="none" stroke="var(--af-fg, #FFFFFF)" stroke-width="1.5"/><circle cx="218" cy="202" r="3.5" fill="var(--af-fg, #FFFFFF)"/><text class="e" x="696" y="206" text-anchor="end">the whole interval is below the margin</text><path d="M24 228 H696" stroke="var(--af-line, #2A2A2A)"/><text class="s" x="24" y="256" text-anchor="start">No decision: underpowered</text><text class="e" x="696" y="256" text-anchor="end">fewer paired tasks than min_tasks: the interval is not read</text><text class="s" x="24" y="284" text-anchor="start">No verdict</text><text class="e" x="696" y="284" text-anchor="end">no decision.yaml committed before the first trial finished</text><text class="e" x="24" y="304" text-anchor="start">Drawn with better to the right, whichever direction the rule names. ● the paired difference, bars its 95% interval.</text></svg>
