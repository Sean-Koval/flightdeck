="#8E9297" fill="none" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" transform="translate(14,10.0) scale(.7)"><rect x="2.5" y="3.5" width="15" height="13"/><path d="M6 8l2.5 2L6 12M10.5 12.5H14"/></g><text class="b b1" x="42" y="20.75">FLIGHTDECK</text><text class="b" x="127" y="20.75">FIXTURE EXPERIMENT</text><text class="b" x="270" y="20.75">12 TASKS × 2 VARIANTS × 3 TRIALS</text><style>@keyframes y0{0%,2.537%{transform:translateX(0)}8.901%,100%{transform:translateX(335.4px)}}.y0{animation:y0 23.65s steps(43,end) infinite}</style><g class="s0"><text class="t" x="18" y="64.8" textLength="351.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck ingest export export --out plane</tspan></text><rect class="y0" x="33.6" y="51.1" width="339.4" height="17.0" fill="#0A0A0A"/></g><g class="s1"><text class="t" x="18" y="81.8">experiment-job-expdemo: 73 runs, 331 spans, 710 events, 2 manifests, 70 grades, 213 test_cases -&gt; plane</text></g><style>@keyframes y2{0%,18.034%{transform:translateX(0)}27.653%,100%{transform:translateX(507.0px)}}.y2{animation:y2 23.65s steps(65,end) infinite}</style><g class="s2"><text class="t" x="18" y="98.8" textLength="522.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck check run --data plane --date 2025-10-16 --specs specs</tspan></text><rect class="y2" x="33.6" y="85.2" width="511.0" height="17.0" fill="#0A0A0A"/></g><g class="s3"><text class="t" x="18" y="115.8">SPEC                       APPLIED  PASSED  FAILED  UNKNOWN</text></g><g class="s4"><text class="t" x="18" y="132.8">ask-before-delete                —       —       —        1  not applied</text></g><g class="s5"><text class="t" x="18" y="149.8">edits-stay-in-repo               1       1       0        1</text></g><g class="s6"><text class="t" x="18" y="166.8">never-delete-outside-repo       72      72       0        1</text></g><g class="s7"><text class="t" x="18" y="183.8">never-push-main                 72      72       0        1</text></g><g class="s8"><text class="t" x="18" y="200.8">tests-before-commit              1       1       0        1</text></g><g class="s9"><text class="t" x="18" y="217.8">5 specs over 73 units: 0 failed, 5 unknown</text></g><style>@keyframes y10{0%,38.309%{transform:translateX(0)}45.560%,100%{transform:translateX(382.2px)}}.y10{animation:y10 23.65s steps(49,end) infinite}</style><g class="s10"><text class="t" x="18" y="234.8" textLength="397.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck stats compare job-expdemo --data plane</tspan></text><rect class="y10" x="33.6" y="221.2" width="386.2" height="17.0" fill="#0A0A0A"/></g><g class="s11"><text class="t" x="18" y="251.8">resolved: treat vs control, experiment job-expdemo, seed 0</text></g><g class="s12"><text class="t" x="18" y="268.8"></text></g><g class="s13"><text class="t" x="18" y="285.8">VARIANT  TRIALS        RESOLVED  95% WILSON    $ PER RESOLVED (95%)</text></g><g class="s14"><text class="t" x="18" y="302.8">control      32  10 of 32 (31%)  18% to 49%  $1.33 ($0.80 to $2.79)</text></g><g class="s15"><text class="t" x="18" y="319.8">treat        31  16 of 31 (52%)  35% to 68%  $0.64 ($0.45 to $1.07)</text></g><g class="s16"><text class="t" x="18" y="336.8"></text></g><g class="s17"><text class="t" x="18" y="353.8">Paired difference treat − control: +21.2 pp (95% CI +1.5 pp to +43.9 pp; task bootstrap, 11 tasks, 63</text></g><g class="s18"><text class="t" x="18" y="370.8">  trials; 3 concordant, 8 discordant tasks).</text></g><g class="s19"><text class="t" x="18" y="387.8"></text></g><g class="s20"><text class="t" x="18" y="404.8">At 11 paired tasks × 3 trials the minimum detectable lift at 80% power is about 35 pp (simulated).</text></g><g class="s21"><text class="t" x="18" y="421.8"></text></g><g class="s22"><text class="t" x="18" y="438.8">Resolved: grader for 63 trials (grader = exit 0 and applied; verify = hangar&#x27;s after-turn verify when</text></g><g class="s23"><text class="t" x="18" y="455.8">  no grader ran).</text></g><g class="s24"><text class="t" x="18" y="472.8"></text></g><g class="s25"><text class="t" x="18" y="489.8">Excluded: cancelled 1, drift 1, infra_error 1, not finished 1, task_invalid 6.</text></g><g class="s26"><text class="t" x="18" y="506.8"></text></g><g class="s27"><text class="t" x="18" y="523.8">Saturated (same outcome in every trial of both arms, no information): t01, t02.</text></g><style>@keyframes y28{0%,58.753%{transform:translateX(0)}73.700%,100%{transform:translateX(787.8px)}}.y28{animation:y28 23.65s steps(101,end) infinite}</style><g class="s28"><text class="t" x="18" y="540.8" textLength="803.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck report experiment job-expdemo --data plane --decision export/decision.yaml --out report.md</tspan></text><rect class="y28" x="33.6" y="527.1" width="791.8" height="17.0" fill="#0A0A0A"/></g><g class="s29"><text class="t c" x="18" y="557.8">treat is better than control on resolved: +21.2 pp (95% CI +1.5 to +43.9, margin −5.0)</text></g><g class="s30"><text class="t" x="18" y="574.8">wrote report.md (73 lines)</text></g><g class="s31"><text class="t" x="18" y="591.8"><tspan class="p">$ ▌</tspan></text></g></svg>
