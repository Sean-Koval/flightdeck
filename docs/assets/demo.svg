{opacity:0}97.316%,100%{opacity:1}}.s27{animation:s27 18.59s step-end infinite}</style><rect width="660" height="537" rx="4" fill="#0A0A0A"/><rect x=".5" y=".5" width="659" height="536" rx="4" fill="none" stroke="#E6E7E3" stroke-opacity=".08"/><path d="M0 34.5H660" stroke="#E6E7E3" stroke-opacity=".09"/><g stroke="#8E9297" fill="none" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" transform="translate(14,10.0) scale(.7)"><rect x="2.5" y="3.5" width="15" height="13"/><path d="M6 8l2.5 2L6 12M10.5 12.5H14"/></g><text class="b b1" x="42" y="20.75">FLIGHTDECK</text><text class="b" x="127" y="20.75">FIXTURE EXPERIMENT</text><text class="b" x="270" y="20.75">12 TASKS × 2 VARIANTS × 3 TRIALS</text><style>@keyframes y0{0%,26.896%{transform:translateX(413.4px)}26.902%,28.510%{transform:translateX(0)}37.063%,100%{transform:translateX(413.4px)}}.y0{animation:y0 18.59s steps(53,end) infinite}</style><g class="s0"><text class="t" x="18" y="64.8" textLength="429.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck ingest export demo/export --out demo/plane</tspan></text><rect class="y0" x="33.6" y="51.1" width="417.4" height="17.0" fill="#0A0A0A"/></g><g class="s1"><text class="t" x="18" y="81.8">experiment-job-expdemo: 73 runs, 331 spans, 710 events, 2 manifests, 70 grades,</text></g><g class="s2"><text class="t" x="18" y="98.8">  213 test_cases -&gt; demo/plane</text></g><style>@keyframes y3{0%,26.896%{transform:translateX(421.2px)}26.902%,46.208%{transform:translateX(0)}54.922%,100%{transform:translateX(421.2px)}}.y3{animation:y3 18.59s steps(54,end) infinite}</style><g class="s3"><text class="t" x="18" y="115.8" textLength="436.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck stats compare job-expdemo --data demo/plane</tspan></text><rect class="y3" x="33.6" y="102.2" width="425.2" height="17.0" fill="#0A0A0A"/></g><g class="s4"><text class="t" x="18" y="132.8">resolved: candidate vs control, experiment job-expdemo, seed 0</text></g><g class="s5"><text class="t" x="18" y="149.8"></text></g><g class="s6"><text class="t" x="18" y="166.8">VARIANT    TRIALS        RESOLVED  95% WILSON    $ PER RESOLVED (95%)</text></g><g class="s7"><text class="t" x="18" y="183.8">control        32  10 of 32 (31%)  18% to 49%  $1.33 ($0.80 to $2.79)</text></g><g class="s8"><text class="t" x="18" y="200.8">candidate      31  16 of 31 (52%)  35% to 68%  $0.64 ($0.45 to $1.07)</text></g><g class="s9"><text class="t" x="18" y="217.8"></text></g><g class="s10"><text class="t" x="18" y="234.8">Paired difference candidate − control: +21.2 pp (95% CI +1.5 pp to +43.9 pp;</text></g><g class="s11"><text class="t" x="18" y="251.8">  task bootstrap, 11 tasks, 63 trials; 3 concordant, 8 discordant tasks).</text></g><g class="s12"><text class="t" x="18" y="268.8"></text></g><g class="s13"><text class="t" x="18" y="285.8">At 11 paired tasks × 3 trials the minimum detectable lift at 80% power is about</text></g><g class="s14"><text class="t" x="18" y="302.8">  35 pp (simulated).</text></g><g class="s15"><text class="t" x="18" y="319.8"></text></g><g class="s16"><text class="t" x="18" y="336.8">Resolved: grader for 63 trials (grader = exit 0 and applied; verify = hangar&#x27;s</text></g><g class="s17"><text class="t" x="18" y="353.8">  after-turn verify when no grader ran).</text></g><g class="s18"><text class="t" x="18" y="370.8"></text></g><g class="s19"><text class="t" x="18" y="387.8">Excluded: cancelled 1, drift 1, infra_error 1, not finished 1, task_invalid 6.</text></g><g class="s20"><text class="t" x="18" y="404.8"></text></g><g class="s21"><text class="t" x="18" y="421.8">Saturated (same outcome in every trial of both arms, no information): t01, t02.</text></g><style>@keyframes y22{0%,26.896%{transform:translateX(468.0px)}26.902%,68.370%{transform:translateX(0)}78.053%,100%{transform:translateX(468.0px)}}.y22{animation:y22 18.59s steps(60,end) infinite}</style><g class="s22"><text class="t" x="18" y="438.8" textLength="483.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck report experiment job-expdemo --data demo/plane \</tspan></text><rect class="y22" x="33.6" y="425.1" width="472.0" height="17.0" fill="#0A0A0A"/></g><style>@keyframes y23{0%,26.896%{transform:translateX(475.8px)}26.902%,78.053%{transform:translateX(0)}87.897%,100%{transform:translateX(475.8px)}}.y23{animation:y23 18.59s steps(61,end) infinite}</style><g class="s23"><text class="t" x="18" y="455.8" textLength="491.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">&gt; </tspan><tspan class="c">    --decision demo/export/decision.yaml --out demo/report.md</tspan></text><rect class="y23" x="33.6" y="442.1" width="479.8" height="17.0" fill="#0A0A0A"/></g><g class="s24"><text class="t c" x="18" y="472.8">candidate is better than control on resolved: +21.2 pp (95% CI +1.5 to +43.9,</text></g><g class="s25"><text class="t" x="18" y="489.8">  margin −5.0)</text></g><g class="s26"><text class="t" x="18" y="506.8">wrote demo/report.md (73 lines)</text></g><g class="s27"><text class="t" x="18" y="523.8"><tspan class="p">$ ▌</tspan></text></g></svg>
