acity:1}}.s16{animation:s16 26.22s step-end infinite}@keyframes s17{0%,44.375%{opacity:0}44.376%,100%{opacity:1}}.s17{animation:s17 26.22s step-end infinite}@keyframes s18{0%,44.603%{opacity:0}44.604%,100%{opacity:1}}.s18{animation:s18 26.22s step-end infinite}@keyframes s19{0%,44.832%{opacity:0}44.833%,100%{opacity:1}}.s19{animation:s19 26.22s step-end infinite}@keyframes s20{0%,45.061%{opacity:0}45.062%,100%{opacity:1}}.s20{animation:s20 26.22s step-end infinite}@keyframes s21{0%,45.290%{opacity:0}45.291%,100%{opacity:1}}.s21{animation:s21 26.22s step-end infinite}@keyframes s22{0%,45.519%{opacity:0}45.520%,100%{opacity:1}}.s22{animation:s22 26.22s step-end infinite}@keyframes s23{0%,51.850%{opacity:0}51.851%,100%{opacity:1}}.s23{animation:s23 26.22s step-end infinite}@keyframes s24{0%,67.239%{opacity:0}67.240%,100%{opacity:1}}.s24{animation:s24 26.22s step-end infinite}@keyframes s25{0%,73.570%{opacity:0}73.571%,100%{opacity:1}}.s25{animation:s25 26.22s step-end infinite}@keyframes s26{0%,78.413%{opacity:0}78.414%,100%{opacity:1}}.s26{animation:s26 26.22s step-end infinite}@keyframes s27{0%,84.744%{opacity:0}84.745%,100%{opacity:1}}.s27{animation:s27 26.22s step-end infinite}</style><rect width="847" height="537" rx="8" fill="#0A0A0A" stroke="#262626"/><rect width="847" height="34" rx="8" fill="#141414"/><rect y="26" width="847" height="8" fill="#141414"/><circle cx="20" cy="17.0" r="5.5" fill="#3A3A3A"/><circle cx="38" cy="17.0" r="5.5" fill="#3A3A3A"/><circle cx="56" cy="17.0" r="5.5" fill="#3A3A3A"/><text class="t d" x="423.5" y="21.5" text-anchor="middle">flightdeck · fixture experiment</text><style>@keyframes y0{0%,2.288%{transform:translateX(0)}8.028%,100%{transform:translateX(335.4px)}}.y0{animation:y0 26.22s steps(43,end) infinite}</style><g class="s0"><text class="t" x="18" y="64.8" textLength="351.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck ingest export export --out plane</tspan></text><rect class="y0" x="33.6" y="51.1" width="339.4" height="17.0" fill="#0A0A0A"/></g><g class="s1"><text class="t" x="18" y="81.8">experiment-job-expdemo: 73 runs, 331 spans, 710 events, 2 manifests, 70 grades, 213 test_cases -&gt; plane</text></g><style>@keyframes y2{0%,16.266%{transform:translateX(0)}24.943%,100%{transform:translateX(507.0px)}}.y2{animation:y2 26.22s steps(65,end) infinite}</style><g class="s2"><text class="t" x="18" y="98.8" textLength="522.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck check run --data plane --date 2025-10-16 --specs specs</tspan></text><rect class="y2" x="33.6" y="85.2" width="511.0" height="17.0" fill="#0A0A0A"/></g><g class="s3"><text class="t" x="18" y="115.8">spec    ask-before-delete   pass=0 fail=0 not_applicable=72 unknown=1</text></g><g class="s4"><text class="t" x="18" y="132.8">spec    edits-stay-in-repo  pass=1 fail=0 not_applicable=71 unknown=1</text></g><g class="s5"><text class="t" x="18" y="149.8">spec    never-delete-outside-repo   pass=72 fail=0 not_applicable=0 unknown=1</text></g><g class="s6"><text class="t" x="18" y="166.8">spec    never-push-main pass=72 fail=0 not_applicable=0 unknown=1</text></g><g class="s7"><text class="t" x="18" y="183.8">spec    tests-before-commit pass=1 fail=0 not_applicable=71 unknown=1</text></g><style>@keyframes y8{0%,34.096%{transform:translateX(0)}40.637%,100%{transform:translateX(382.2px)}}.y8{animation:y8 26.22s steps(49,end) infinite}</style><g class="s8"><text class="t" x="18" y="200.8" textLength="397.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck stats compare job-expdemo --data plane</tspan></text><rect class="y8" x="33.6" y="187.2" width="386.2" height="17.0" fill="#0A0A0A"/></g><g class="s9"><text class="t h" x="18" y="217.8">**resolved**: treat vs control, experiment `job-expdemo`, seed 0</text></g><g class="s10"><text class="t" x="18" y="234.8"></text></g><g class="s11"><text class="t" x="18" y="251.8">| variant | trials | resolved (95% Wilson) | $ / resolved (95%) |</text></g><g class="s12"><text class="t" x="18" y="268.8">| --- | --- | --- | --- |</text></g><g class="s13"><text class="t" x="18" y="285.8">| control | 32 | 10/32 = 31.2% [18.0%, 48.6%] | 1.333 [0.801, 2.795] |</text></g><g class="s14"><text class="t" x="18" y="302.8">| treat | 31 | 16/31 = 51.6% [34.8%, 68.0%] | 0.639 [0.448, 1.071] |</text></g><g class="s15"><text class="t" x="18" y="319.8"></text></g><g class="s16"><text class="t" x="18" y="336.8">Paired difference treat - control: **+21.2 pp**, 95% CI +1.5 pp to +43.9 pp (task bootstrap; 11 tasks,</text></g><g class="s17"><text class="t" x="18" y="353.8">  63 trials; 3 concordant, 8 discordant tasks).</text></g><g class="s18"><text class="t" x="18" y="370.8">At 11 paired tasks x 3 trials the minimum detectable lift at 80% power is about 35% (r1 simulation).</text></g><g class="s19"><text class="t" x="18" y="387.8">Resolved: grader for 63 trials (grader = exit 0 and applied; verify = hangar&#x27;s after-turn verify when</text></g><g class="s20"><text class="t" x="18" y="404.8">  no grader ran).</text></g><g class="s21"><text class="t" x="18" y="421.8">Excluded: cancelled 1, drift 1, infra_error 1, not finished 1, task_invalid 6.</text></g><g class="s22"><text class="t" x="18" y="438.8">Saturated (same outcome in every trial of both arms, no information): t01, t02.</text></g><style>@keyframes y23{0%,51.850%{transform:translateX(0)}65.332%,100%{transform:translateX(787.8px)}}.y23{animation:y23 26.22s steps(101,end) infinite}</style><g class="s23"><text class="t" x="18" y="455.8" textLength="803.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck report experiment job-expdemo --data plane --decision export/decision.yaml --out report.md</tspan></text><rect class="y23" x="33.6" y="442.1" width="791.8" height="17.0" fill="#0A0A0A"/></g><g class="s24"><text class="t" x="18" y="472.8"></text></g><style>@keyframes y25{0%,73.570%{transform:translateX(0)}76.506%,100%{transform:translateX(171.6px)}}.y25{animation:y25 26.22s steps(22,end) infinite}</style><g class="s25"><text class="t" x="18" y="489.8" textLength="187.2" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">grep Verdict report.md</tspan></text><rect class="y25" x="33.6" y="476.1" width="175.6" height="17.0" fill="#0A0A0A"/></g><g class="s26"><text class="t h" x="18" y="506.8">**Verdict**: treat is better than control on resolved (+21.2 pp, CI +1.5…+43.9, margin -5.0).</text></g><g class="s27"><text class="t" x="18" y="523.8"><tspan class="p">$ </tspan><tspan class="c">▌</tspan></text></g></svg>
