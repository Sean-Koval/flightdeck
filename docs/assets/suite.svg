<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" style="max-width:100%;height:auto" role="img" aria-label="Where flightdeck sits: hangar runs, flightdeck judges, the pull request decides; Tower, planned, governs promotions"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="suite-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="420" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">Where flightdeck sits · run / judge / decide</text><rect x="24" y="56" width="160" height="276" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="l" x="38" y="78">Run</text><text class="n" x="38" y="100">hangar</text><text class="b" x="38" y="122">runs coding agents</text><text class="b" x="38" y="140">in sandboxes;</text><text class="b" x="38" y="158">records manifests,</text><text class="b" x="38" y="176">traces and the</text><text class="b" x="38" y="194">experiment index.</text><text class="b" x="38" y="212">Runs the trials it</text><text class="b" x="38" y="230">is asked for, pinned;</text><text class="b" x="38" y="248">does no analysis.</text><rect x="280" y="56" width="160" height="276" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="l" x="294" y="78">Judge</text><text class="n" x="294" y="100">flightdeck</text><rect x="292" y="116" width="136" height="40" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="304" y="134">ingest</text><text class="e" x="304" y="148">REST or an export</text><rect x="292" y="166" width="136" height="40" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="304" y="184">data plane</text><text class="e" x="304" y="198">Parquet · DuckDB</text><path class="edge" d="M360 156 V164" marker-end="url(#suite-arrow)"/><rect x="292" y="216" width="136" height="40" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="304" y="234">stats · check</text><text class="e" x="304" y="248">paired by task · specs</text><path class="edge" d="M360 206 V214" marker-end="url(#suite-arrow)"/><rect x="292" y="266" width="136" height="40" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="304" y="284">report</text><text class="e" x="304" y="298">a pre-registered rule</text><path class="edge" d="M360 256 V264" marker-end="url(#suite-arrow)"/><rect x="536" y="56" width="160" height="276" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="l" x="550" y="78">Decide</text><text class="n" x="550" y="100">the pull request</text><text class="b" x="550" y="122">one comment, updated</text><text class="b" x="550" y="140">in place: verdict,</text><text class="b" x="550" y="158">pins, outcome, cost,</text><text class="b" x="550" y="176">behavior specs.</text><text class="b" x="550" y="194">A reviewer decides;</text><text class="b" x="550" y="212">the approver is</text><text class="b" x="550" y="230">never the author.</text><path class="edge" d="M184 166 H276" marker-end="url(#suite-arrow)"/><text class="e" x="232" y="144" text-anchor="middle">runs, traces,</text><text class="e" x="232" y="159" text-anchor="middle">the index</text><path class="edge" d="M280 256 H188" marker-end="url(#suite-arrow)"/><text class="e" x="232" y="278" text-anchor="middle">trials to run:</text><text class="e" x="232" y="293" text-anchor="middle">tasks × arms × n</text><path class="edge" d="M440 166 H532" marker-end="url(#suite-arrow)"/><text class="e" x="488" y="156" text-anchor="middle">the report</text><rect x="24" y="358" width="672" height="40" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line-strong, #6B6B6B)" stroke-dasharray="4 4" fill-opacity="0"/><text class="n" x="38" y="384"></text><text class="l" x="38" y="383" text-anchor="start">Govern · planned</text><text class="s" x="140" y="383" text-anchor="start">Tower: policy decisions, approvals, receipts</text><path class="plan" d="M616 332 V354" marker-end="url(#suite-arrow)"/><text class="e" x="608" y="348" text-anchor="end">promotion approval</text></svg>
