<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Where flightdeck sits: hangar runs, flightdeck judges, the pull request decides"><style>.fd-d .n{font:700 17px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #fff)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #fff)}.fd-d .b{font:400 12.5px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 12.5px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 10.5px 'DM Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="1200" height="600" fill="var(--af-canvas, #000)"/><text class="l" x="40" y="44">WHERE FLIGHTDECK SITS · RUN / JUDGE / GOVERN</text><rect x="30" y="90" width="270" height="300" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line, #262626)"/><rect x="30" y="90" width="270" height="2" fill="var(--af-p-hangar, #EE8F63)"/><text class="l" x="48" y="116">RUN</text><text class="n" x="48" y="140">hangar</text><text class="b" x="48" y="164">runs coding agents in sandboxes</text><text class="b" x="48" y="183">records manifests, traces and</text><text class="b" x="48" y="202">the experiment index</text><text class="b" x="48" y="221">runs the trials it is asked for,</text><text class="b" x="48" y="240">pinned; does no analysis</text><rect x="430" y="70" width="360" height="380" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-brand-line, #FFC400)" stroke-width="1.5"/><rect x="430" y="70" width="360" height="2" fill="var(--af-p-flightdeck, #D98CD2)"/><text class="l" x="448" y="96">JUDGE</text><text class="n" x="448" y="120">flightdeck</text><rect x="460" y="140" width="300" height="52" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="474" y="161">ingest</text><text class="b" x="474" y="180">hangar REST or an experiment export</text><rect x="460" y="212" width="300" height="52" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="474" y="233">data plane</text><text class="b" x="474" y="252">flightdeck.parquet/v1 · DuckDB</text><path class="edge" d="M610 192 V210" marker-end="url(#fd-arrow)"/><rect x="460" y="284" width="300" height="52" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="474" y="305">stats compare · check run</text><text class="b" x="474" y="324">paired by task · behavior specs</text><path class="edge" d="M610 264 V282" marker-end="url(#fd-arrow)"/><rect x="460" y="356" width="300" height="52" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="474" y="377">report</text><text class="b" x="474" y="396">verdict from a pre-registered rule</text><path class="edge" d="M610 336 V354" marker-end="url(#fd-arrow)"/><rect x="890" y="90" width="270" height="300" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line, #262626)"/><text class="l" x="908" y="116">DECIDE</text><text class="n" x="908" y="140">the pull request</text><text class="b" x="908" y="164">one comment, updated in place</text><text class="b" x="908" y="183">verdict, pins, outcome, cost,</text><text class="b" x="908" y="202">behavior specs</text><text class="b" x="908" y="221">a reviewer decides; the</text><text class="b" x="908" y="240">approver is never the author</text><path class="edge" d="M300 200 H426" marker-end="url(#fd-arrow)"/><text class="e" x="365" y="170" text-anchor="middle">manifests, traces,</text><text class="e" x="365" y="186" text-anchor="middle">experiment index</text><path class="edge" d="M430 330 H304" marker-end="url(#fd-arrow)"/><text class="e" x="365" y="356" text-anchor="middle">trials:</text><text class="e" x="365" y="372" text-anchor="middle">tasks × variants × n</text><path class="edge" d="M790 381 H886" marker-end="url(#fd-arrow)"/><text class="e" x="838" y="371" text-anchor="middle">report</text><rect x="430" y="490" width="730" height="80" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line-strong, #6B6B6B)" stroke-dasharray="4 4" fill-opacity="0"/><rect x="430" y="490" width="730" height="2" fill="var(--af-p-workspace, #C5A93B)"/><text class="l" x="448" y="516">GOVERN · PLANNED</text><text class="n" x="448" y="540">governed workspace: policy decisions, approvals, receipts</text><path class="plan" d="M1025 390 V486" marker-end="url(#fd-arrow)"/><text class="e" x="1035" y="446" text-anchor="start">promotion approval</text></svg>
