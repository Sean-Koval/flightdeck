<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" style="max-width:100%;height:auto" role="img" aria-label="Paired by task: each task runs three trials in both arms; saturated tasks carry no information, discordant tasks drive the paired difference, and the interval comes from resampling tasks"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="pair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="262" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">PAIRED BY TASK · THE COMPARISON RESAMPLES TASKS, NOT TRIALS</text><text class="l" x="24" y="62" text-anchor="start">TASK</text><text class="l" x="120" y="62" text-anchor="start">CONTROL</text><text class="l" x="260" y="62" text-anchor="start">CANDIDATE</text><text class="l" x="420" y="62" text-anchor="start">WHAT THE PAIR SAYS</text><path d="M24 70 H696" stroke="var(--af-line, #2A2A2A)"/><text class="k" x="24" y="94" text-anchor="start">t01</text><text class="k" x="120" y="94" text-anchor="start">● ● ●</text><text class="k" x="260" y="94" text-anchor="start">● ● ●</text><text class="e" x="420" y="94" text-anchor="start">saturated: no information</text><text class="k" x="24" y="118" text-anchor="start">t02</text><text class="k" x="120" y="118" text-anchor="start">○ ○ ○</text><text class="k" x="260" y="118" text-anchor="start">○ ○ ○</text><text class="e" x="420" y="118" text-anchor="start">saturated: no information</text><text class="k" x="24" y="142" text-anchor="start">t03</text><text class="k" x="120" y="142" text-anchor="start">○ ● ○</text><text class="k" x="260" y="142" text-anchor="start">● ● ○</text><text class="b" x="420" y="142" text-anchor="start">discordant: +1 of 3</text><text class="k" x="24" y="166" text-anchor="start">t04</text><text class="k" x="120" y="166" text-anchor="start">○ ○ ●</text><text class="k" x="260" y="166" text-anchor="start">● ● ●</text><text class="b" x="420" y="166" text-anchor="start">discordant: +2 of 3</text><text class="k" x="24" y="190" text-anchor="start">t05</text><text class="k" x="120" y="190" text-anchor="start">● ○ ●</text><text class="k" x="260" y="190" text-anchor="start">○ ● ●</text><text class="e" x="420" y="190" text-anchor="start">concordant: the same rate</text><text class="k" x="24" y="214" text-anchor="start">…</text><text class="k" x="120" y="214" text-anchor="start"></text><text class="k" x="260" y="214" text-anchor="start"></text><text class="e" x="420" y="214" text-anchor="start">every task runs in both arms</text><text class="e" x="24" y="236" text-anchor="start">● resolved  ○ not resolved. The paired difference is the mean over tasks of the candidate rate minus</text><text class="e" x="24" y="251" text-anchor="start">the control rate; its interval comes from resampling tasks. A task with one arm missing is left out.</text></svg>
