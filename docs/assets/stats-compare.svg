<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 847 316" width="847" height="316" role="img" aria-label="flightdeck stats compare"><style>.t{font:13px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D9D9D9;white-space:pre}.p{fill:#FFC400}.c{fill:#FFFFFF}.h{fill:#D98CD2}.d{fill:#8A8A8A}</style><rect width="847" height="316" rx="8" fill="#0A0A0A" stroke="#262626"/><rect width="847" height="34" rx="8" fill="#141414"/><rect y="26" width="847" height="8" fill="#141414"/><circle cx="20" cy="17.0" r="5.5" fill="#3A3A3A"/><circle cx="38" cy="17.0" r="5.5" fill="#3A3A3A"/><circle cx="56" cy="17.0" r="5.5" fill="#3A3A3A"/><text class="t d" x="423.5" y="21.5" text-anchor="middle">flightdeck stats compare</text><text class="t" x="18" y="64.8" textLength="397.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck stats compare job-expdemo --data plane</tspan></text><text class="t h" x="18" y="81.8">**resolved**: treat vs control, experiment `job-expdemo`, seed 0</text><text class="t" x="18" y="98.8"></text><text class="t" x="18" y="115.8">| variant | trials | resolved (95% Wilson) | $ / resolved (95%) |</text><text class="t" x="18" y="132.8">| --- | --- | --- | --- |</text><text class="t" x="18" y="149.8">| control | 32 | 10/32 = 31.2% [18.0%, 48.6%] | 1.333 [0.801, 2.795] |</text><text class="t" x="18" y="166.8">| treat | 31 | 16/31 = 51.6% [34.8%, 68.0%] | 0.639 [0.448, 1.071] |</text><text class="t" x="18" y="183.8"></text><text class="t" x="18" y="200.8">Paired difference treat - control: **+21.2 pp**, 95% CI +1.5 pp to +43.9 pp (task bootstrap; 11 tasks,</text><text class="t" x="18" y="217.8">  63 trials; 3 concordant, 8 discordant tasks).</text><text class="t" x="18" y="234.8">At 11 paired tasks x 3 trials the minimum detectable lift at 80% power is about 35% (simulated).</text><text class="t" x="18" y="251.8">Resolved: grader for 63 trials (grader = exit 0 and applied; verify = hangar&#x27;s after-turn verify when</text><text class="t" x="18" y="268.8">  no grader ran).</text><text class="t" x="18" y="285.8">Excluded: cancelled 1, drift 1, infra_error 1, not finished 1, task_invalid 6.</text><text class="t" x="18" y="302.8">Saturated (same outcome in every trial of both arms, no information): t01, t02.</text></svg>
