<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" style="max-width:100%;height:auto" role="img" aria-label="A task directory: task.toml, instruction.md, environment, tests and an optional solution; the agent sees the instruction in the environment, and the hidden tests grade the trial&#x27;s patch in a clean sandbox and write reward.json"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="task-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="250" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">A task directory · what the agent sees, and what grades it</text><rect x="24" y="52" width="208" height="174" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="n" x="38" y="78">&lt;task-id&gt;/</text><text class="k" x="38" y="104" text-anchor="start">task.toml</text><text class="k" x="38" y="130" text-anchor="start">instruction.md</text><text class="k" x="38" y="156" text-anchor="start">environment/</text><text class="k" x="38" y="182" text-anchor="start">tests/</text><text class="k" x="38" y="208" text-anchor="start">solution/</text><rect x="288" y="52" width="408" height="76" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="l" x="302" y="74">The agent sees</text><text class="n" x="302" y="96">the instruction, in the environment</text><text class="b" x="302" y="118">instruction.md verbatim; a sandbox from environment/</text><rect x="288" y="150" width="408" height="76" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="l" x="302" y="172">The grader runs, hidden</text><text class="n" x="302" y="194">tests/test.sh writes reward.json</text><text class="b" x="302" y="216">on the trial&#x27;s patch, in a clean sandbox the agent never reaches</text><path class="edge" d="M176 126 H284" marker-end="url(#task-arrow)"/><path class="edge" d="M176 178 H284" marker-end="url(#task-arrow)"/></svg>
