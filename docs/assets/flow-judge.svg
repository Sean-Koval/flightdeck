<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" width="720" height="196" style="max-width:100%;height:auto" role="img" aria-label="A rubric judge&#x27;s lifecycle: people label a blind sample, the judge labels the same runs, calibration computes Cohen&#x27;s kappa against the people, scores are stored with the rubric&#x27;s status, and estimates combine judge and human labels by prediction-powered inference"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="judge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="196" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">A rubric judge · used only once it agrees with people</text><rect x="24" y="52" width="120" height="36" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="36" y="76">label</text><text class="e" x="26" y="112" text-anchor="start">people label a</text><text class="e" x="26" y="127" text-anchor="start">seeded, blind sample</text><path class="edge" d="M144 70 H158" marker-end="url(#judge-arrow)"/><rect x="160" y="52" width="120" height="36" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="172" y="76">judge</text><text class="e" x="162" y="112" text-anchor="start">the model labels the</text><text class="e" x="162" y="127" text-anchor="start">same runs, elsewhere</text><path class="edge" d="M280 70 H294" marker-end="url(#judge-arrow)"/><rect x="296" y="52" width="120" height="36" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="308" y="76">calibrate</text><text class="e" x="298" y="112" text-anchor="start">Cohen&#x27;s κ against the</text><text class="e" x="298" y="127" text-anchor="start">people, with its interval</text><path class="edge" d="M416 70 H430" marker-end="url(#judge-arrow)"/><rect x="432" y="52" width="120" height="36" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="444" y="76">score</text><text class="e" x="434" y="112" text-anchor="start">labels stored with the</text><text class="e" x="434" y="127" text-anchor="start">rubric&#x27;s status</text><path class="edge" d="M552 70 H566" marker-end="url(#judge-arrow)"/><rect x="568" y="52" width="120" height="36" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="580" y="76">estimate</text><text class="e" x="570" y="112" text-anchor="start">PPI: judge and human</text><text class="e" x="570" y="127" text-anchor="start">labels, one interval</text><text class="b" x="24" y="164" text-anchor="start">usable: κ&#x27;s lower bound ≥ 0.6 · provisional: only the point estimate is · unusable: below that</text><text class="e" x="24" y="182" text-anchor="start">Change the rubric&#x27;s text, examples, prompt or judge model and it is stale: calibrate again.</text></svg>
