<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" style="max-width:100%;height:auto" role="img" aria-label="An experiment: a suite is planned into pinned trials, passed through the cost gate, run by hangar, collected into the data plane and reported; the cache skips trials whose inputs are unchanged"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="exp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="260" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">An experiment · from suite to report</text><rect x="24" y="52" width="200" height="48" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="36" y="70">suite.yaml</text><text class="e" x="36" y="84">tasks, variants, trials</text><path class="edge" d="M224 76 H252" marker-end="url(#exp-arrow)"/><rect x="256" y="52" width="200" height="48" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="268" y="70">plan</text><text class="e" x="268" y="84">tasks × arms × n, pinned</text><path class="edge" d="M456 76 H484" marker-end="url(#exp-arrow)"/><rect x="488" y="52" width="200" height="48" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="500" y="70">cost gate</text><text class="e" x="500" y="84">projected spend ≤ budget</text><rect x="24" y="188" width="200" height="48" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="36" y="206">hangar runs it</text><text class="e" x="36" y="220">queued, isolated, pinned</text><path class="edge" d="M224 212 H252" marker-end="url(#exp-arrow)"/><rect x="256" y="188" width="200" height="48" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="268" y="206">collect</text><text class="e" x="268" y="220">into the data plane</text><path class="edge" d="M456 212 H484" marker-end="url(#exp-arrow)"/><rect x="488" y="188" width="200" height="48" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="500" y="206">report</text><text class="e" x="500" y="220">verdict on the pull request</text><path class="edge" d="M588 100 V176 H124 V184" marker-end="url(#exp-arrow)"/><rect x="256" y="124" width="200" height="40" rx="8" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="268" y="142">cache</text><text class="e" x="268" y="156">unchanged inputs: the trial is reused</text><path class="plan" d="M356 124 V104" marker-end="url(#exp-arrow)"/><text class="e" x="470" y="141" text-anchor="start">so plan submits only</text><text class="e" x="470" y="156" text-anchor="start">what is missing</text></svg>
