<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 537" width="660" height="537" role="img" aria-label="flightdeck, fixture experiment, 12 tasks × 2 variants × 3 trials"><style>.t{font:13px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E6E7E3;white-space:pre}.p{fill:#FFC400}.c{fill:#FFFFFF}.x{fill:#FF4D4D}.b{font:500 10.5px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:#8E9297}.b1{fill:#E6E7E3}</style><rect width="660" height="537" rx="4" fill="#0A0A0A"/><rect x=".5" y=".5" width="659" height="536" rx="4" fill="none" stroke="#E6E7E3" stroke-opacity=".08"/><path d="M0 34.5H660" stroke="#E6E7E3" stroke-opacity=".09"/><g stroke="#8E9297" fill="none" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" transform="translate(14,10.0) scale(.7)"><rect x="2.5" y="3.5" width="15" height="13"/><path d="M6 8l2.5 2L6 12M10.5 12.5H14"/></g><text class="b b1" x="42" y="20.75">FLIGHTDECK</text><text class="b" x="127" y="20.75">FIXTURE EXPERIMENT</text><text class="b" x="270" y="20.75">12 TASKS × 2 VARIANTS × 3 TRIALS</text><text class="t" x="18" y="64.8" textLength="429.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck ingest export demo/export --out demo/plane</tspan></text><text class="t" x="18" y="81.8">experiment-job-expdemo: 73 runs, 331 spans, 710 events, 2 manifests, 70 grades,</text><text class="t" x="18" y="98.8">  213 test_cases -&gt; demo/plane</text><text class="t" x="18" y="115.8" textLength="436.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck stats compare job-expdemo --data demo/plane</tspan></text><text class="t" x="18" y="132.8">resolved: candidate vs control, experiment job-expdemo, seed 0</text><text class="t" x="18" y="149.8"></text><text class="t" x="18" y="166.8">VARIANT    TRIALS        RESOLVED  95% WILSON    $ PER RESOLVED (95%)</text><text class="t" x="18" y="183.8">control        32  10 of 32 (31%)  18% to 49%  $1.33 ($0.80 to $2.79)</text><text class="t" x="18" y="200.8">candidate      31  16 of 31 (52%)  35% to 68%  $0.64 ($0.45 to $1.07)</text><text class="t" x="18" y="217.8"></text><text class="t" x="18" y="234.8">Paired difference candidate − control: +21.2 pp (95% CI +1.5 pp to +43.9 pp;</text><text class="t" x="18" y="251.8">  task bootstrap, 11 tasks, 63 trials; 3 concordant, 8 discordant tasks).</text><text class="t" x="18" y="268.8"></text><text class="t" x="18" y="285.8">At 11 paired tasks × 3 trials the minimum detectable lift at 80% power is about</text><text class="t" x="18" y="302.8">  35 pp (simulated).</text><text class="t" x="18" y="319.8"></text><text class="t" x="18" y="336.8">Resolved: grader for 63 trials (grader = exit 0 and applied; verify = hangar&#x27;s</text><text class="t" x="18" y="353.8">  after-turn verify when no grader ran).</text><text class="t" x="18" y="370.8"></text><text class="t" x="18" y="387.8">Excluded: cancelled 1, drift 1, infra_error 1, not finished 1, task_invalid 6.</text><text class="t" x="18" y="404.8"></text><text class="t" x="18" y="421.8">Saturated (same outcome in every trial of both arms, no information): t01, t02.</text><text class="t" x="18" y="438.8" textLength="483.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">flightdeck report experiment job-expdemo --data demo/plane \</tspan></text><text class="t" x="18" y="455.8" textLength="491.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">&gt; </tspan><tspan class="c">    --decision demo/export/decision.yaml --out demo/report.md</tspan></text><text class="t c" x="18" y="472.8">candidate is better than control on resolved: +21.2 pp (95% CI +1.5 to +43.9,</text><text class="t" x="18" y="489.8">  margin −5.0)</text><text class="t" x="18" y="506.8">wrote demo/report.md (73 lines)</text><text class="t" x="18" y="523.8"><tspan class="p">$ ▌</tspan></text></svg>
