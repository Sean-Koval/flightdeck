<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" style="max-width:100%;height:auto" role="img" aria-label="A sealed holdout: briefed to blind writers, written, sealed with canaries and hashes, run once on the candidate and scored once by an approver who is not the author; a nightly canary scan voids a leaked set"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="hold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="236" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">A SEALED HOLDOUT · WRITTEN BLIND, SCORED ONCE</text><rect x="24" y="52" width="120" height="36" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="36" y="76">brief</text><text class="e" x="26" y="112" text-anchor="start">writers who are not</text><text class="e" x="26" y="127" text-anchor="start">the change&#x27;s authors</text><path class="edge" d="M144 70 H158" marker-end="url(#hold-arrow)"/><rect x="160" y="52" width="120" height="36" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="172" y="76">write blind</text><text class="e" x="162" y="112" text-anchor="start">tasks land in</text><text class="e" x="162" y="127" text-anchor="start">incoming/&lt;writer&gt;/</text><path class="edge" d="M280 70 H294" marker-end="url(#hold-arrow)"/><rect x="296" y="52" width="120" height="36" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="308" y="76">seal</text><text class="e" x="298" y="112" text-anchor="start">canaries and hashes</text><text class="e" x="298" y="127" text-anchor="start">added; plaintext gone</text><path class="edge" d="M416 70 H430" marker-end="url(#hold-arrow)"/><rect x="432" y="52" width="120" height="36" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="444" y="76">run</text><text class="e" x="434" y="112" text-anchor="start">decrypted, one arm,</text><text class="e" x="434" y="127" text-anchor="start">egress none</text><path class="edge" d="M552 70 H566" marker-end="url(#hold-arrow)"/><rect x="568" y="52" width="120" height="36" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="580" y="76">score once</text><text class="e" x="570" y="112" text-anchor="start">approver ≠ author;</text><text class="e" x="570" y="127" text-anchor="start">then the set is spent</text><rect x="24" y="160" width="672" height="52" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line-strong, #6B6B6B)" stroke-dasharray="4 4" fill-opacity="0"/><text class="n" x="38" y="186"></text><text class="l" x="38" y="182" text-anchor="start">NIGHTLY</text><text class="b" x="38" y="200" text-anchor="start">canary-scan reads the last days&#x27; traces for the set&#x27;s canary strings; a hit voids the set.</text></svg>
