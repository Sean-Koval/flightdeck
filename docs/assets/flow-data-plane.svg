<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" style="max-width:100%;height:auto" role="img" aria-label="The data plane: hangar&#x27;s outbox is compacted nightly and an export or REST response is ingested on demand, both into Parquet tables that DuckDB views read for stats, check and report"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="plane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="236" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">THE DATA PLANE · TWO WAYS IN, ONE WAY OUT</text><rect x="24" y="52" width="200" height="64" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="n" x="38" y="78">hangar&#x27;s outbox</text><text class="b" x="38" y="100">one hangar.run/v1 per run,</text><text class="b" x="38" y="118">written to GCS</text><rect x="24" y="140" width="200" height="64" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="n" x="38" y="166">an export, or REST</text><text class="b" x="38" y="188">hangar experiment export,</text><text class="b" x="38" y="206">or GET /api/experiments/{id}</text><rect x="264" y="64" width="140" height="40" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="276" y="82">compact</text><text class="e" x="276" y="96">nightly, on Cloud Run</text><rect x="264" y="152" width="140" height="40" rx="3" fill="var(--af-surface, #0A0A0A)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="s" x="276" y="170">ingest</text><text class="e" x="276" y="184">when you need it now</text><rect x="444" y="52" width="252" height="152" rx="3" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="n" x="458" y="78">the data plane</text><text class="b" x="458" y="100">Parquet: one table per kind</text><text class="b" x="458" y="118">of record, partitioned by day</text><text class="b" x="458" y="136">(flightdeck.parquet/v1).</text><text class="b" x="458" y="154"></text><text class="b" x="458" y="172">DuckDB views over it feed</text><text class="b" x="458" y="190">stats, check and report.</text><path class="edge" d="M224 84 H260" marker-end="url(#plane-arrow)"/><path class="edge" d="M404 84 H440" marker-end="url(#plane-arrow)"/><path class="edge" d="M224 172 H260" marker-end="url(#plane-arrow)"/><path class="edge" d="M404 172 H440" marker-end="url(#plane-arrow)"/></svg>
