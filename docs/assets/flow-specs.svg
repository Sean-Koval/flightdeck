<svg class="fd-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" width="720" height="226" style="max-width:100%;height:auto" role="img" aria-label="A behavior spec: hangar&#x27;s trace, flattened into the data plane, is judged by a YAML spec with applies_when, a scope and one assert operator; each unit gets one result, pass, fail, not_applicable or unknown, from two evaluators that agree"><style>.fd-d .n{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:var(--af-fg, #FFFFFF)}.fd-d .b{font:400 13px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-muted, #A6A6A6)}.fd-d .e{font:400 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .l{font:500 11px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:var(--af-fg-subtle, #8A8A8A)}.fd-d .k{font:500 11px 'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--af-fg, #FFFFFF)}.fd-d .edge{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25}.fd-d .plan{fill:none;stroke:var(--af-fg-subtle, #8A8A8A);stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="specs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--af-fg-subtle, #8A8A8A)"/></marker></defs><rect width="720" height="226" fill="var(--af-canvas, #000000)"/><text class="l" x="24" y="30">A behavior spec · a predicate over the trace, never over the outcome</text><rect x="24" y="52" width="176" height="132" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="n" x="38" y="78">the trace</text><text class="b" x="38" y="100">hangar.trace/v1,</text><text class="b" x="38" y="118">flattened into the</text><text class="b" x="38" y="136">data plane: tool calls,</text><text class="b" x="38" y="154">approvals, test runs</text><rect x="272" y="52" width="176" height="132" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line-strong, #6B6B6B)"/><text class="n" x="286" y="78">a spec</text><text class="b" x="286" y="100">YAML: applies_when,</text><text class="b" x="286" y="118">a scope (turn, job,</text><text class="b" x="286" y="136">session), one assert</text><text class="b" x="286" y="154">operator over matchers</text><rect x="520" y="52" width="176" height="132" rx="12" fill="var(--af-raised, #141414)" stroke="var(--af-line, #2A2A2A)"/><text class="n" x="534" y="78">one result per unit</text><text class="k" x="534" y="104" text-anchor="start">pass</text><text class="k" x="534" y="124" text-anchor="start">fail</text><text class="k" x="534" y="144" text-anchor="start">not_applicable</text><text class="k" x="534" y="164" text-anchor="start">unknown</text><path class="edge" d="M200 118 H268" marker-end="url(#specs-arrow)"/><path class="edge" d="M448 118 H516" marker-end="url(#specs-arrow)"/><text class="e" x="24" y="208" text-anchor="start">Two evaluators, Python over one export and SQL over the data plane, give the same results.</text></svg>
